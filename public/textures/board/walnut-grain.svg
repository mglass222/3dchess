<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The feComponentTransfer tone targets below (and DARK_SQ/LIGHT_SQ in
       scene.js, which were calibrated against this file's rendered output)
       only land because SVG filters default to
       color-interpolation-filters: linearRGB. If anyone "fixes" that to
       sRGB (explicitly or via a browser/library default change), this wood
       renders roughly 30% darker and silently breaks the calibration. -->
  <defs>
    <filter id="walnutGrain" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <!-- Directional figure: coarser cross-grain frequency than maple, long streaks along the grain axis. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.042 0.0018" numOctaves="4" seed="71"
                    stitchTiles="stitch" result="figureNoise"/>
      <feColorMatrix in="figureNoise" type="saturate" values="0" result="figureGray"/>
      <feComponentTransfer in="figureGray" result="figureToned">
        <feFuncR type="linear" slope="0.50" intercept="0.204"/>
        <feFuncG type="linear" slope="0.50" intercept="0.204"/>
        <feFuncB type="linear" slope="0.50" intercept="0.159"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>

      <!-- Sparse pore layer: stronger/darker than maple's, still scattered flecks rather than a repeating rosette. -->
      <feTurbulence type="turbulence" baseFrequency="0.75 0.75" numOctaves="2" seed="87"
                    stitchTiles="stitch" result="poreNoise"/>
      <feColorMatrix in="poreNoise" type="saturate" values="0" result="poreGray"/>
      <feComponentTransfer in="poreGray" result="poreMask">
        <feFuncR type="discrete" tableValues="1 1 1 0.82 0.62 0.42"/>
        <feFuncG type="discrete" tableValues="1 1 1 0.82 0.62 0.42"/>
        <feFuncB type="discrete" tableValues="1 1 1 0.82 0.62 0.42"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>

      <feBlend in="figureToned" in2="poreMask" mode="multiply" result="withPores"/>
      <feComponentTransfer in="withPores">
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="1024" filter="url(#walnutGrain)"/>
</svg>
